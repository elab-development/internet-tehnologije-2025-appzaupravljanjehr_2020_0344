components:
  schemas:
    Cilj:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        naziv:
          type: string
          maxLength: 100
        tip_cilja:
          type: integer
        tip_cilja_naziv:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/CiljStatusEnum'
      required:
      - id
      - naziv
      - tip_cilja
      - tip_cilja_naziv
    CiljRequestRequest:
      type: object
      properties:
        naziv:
          type: string
          minLength: 1
        tip_cilja:
          type: integer
        status:
          type: string
          minLength: 1
          description: 'podrazumevano: aktivan'
      required:
      - naziv
      - tip_cilja
    CiljStatusEnum:
      enum:
      - aktivan
      - neaktivan
      type: string
      description: |-
        * `aktivan` - Aktivan
        * `neaktivan` - Neaktivan
    DodelaMasovnoRequestRequest:
      type: object
      properties:
        cilj:
          type: integer
        datum_Od:
          type: string
          format: date
        datum_Do:
          type: string
          format: date
        organizaciona_jedinica:
          type: integer
        radno_mesto:
          type: integer
        zaposleni_ids:
          type: array
          items:
            type: integer
      required:
      - cilj
      - datum_Do
      - datum_Od
    DodelaMasovnoResponse:
      type: object
      properties:
        success:
          type: boolean
        created:
          type: integer
        skipped:
          type: integer
        message:
          type: string
      required:
      - created
      - message
      - skipped
      - success
    DodeljeniCilj:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cilj:
          type: integer
        cilj_naziv:
          type: string
          readOnly: true
        zaposleni:
          type: integer
        zaposleni_ime:
          type: string
          readOnly: true
        datum_Od:
          type: string
          format: date
        datum_Do:
          type: string
          format: date
      required:
      - cilj
      - cilj_naziv
      - datum_Do
      - datum_Od
      - id
      - zaposleni
      - zaposleni_ime
    DodeljeniCiljRequestRequest:
      type: object
      properties:
        cilj:
          type: integer
        zaposleni:
          type: integer
        datum_Od:
          type: string
          format: date
        datum_Do:
          type: string
          format: date
      required:
      - cilj
      - datum_Do
      - datum_Od
      - zaposleni
    DodeljeniKPI:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kpi:
          type: integer
        kpi_naziv:
          type: string
          readOnly: true
        kpi_opis:
          type: string
          readOnly: true
        kpi_target:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        korisnik:
          type: integer
        korisnik_ime:
          type: string
          readOnly: true
        datum_Od:
          type: string
          format: date
        datum_Do:
          type: string
          format: date
        datum_dodele:
          type: string
          format: date
          readOnly: true
        poslednja_vrednost:
          type: string
          readOnly: true
        procenat:
          type: string
          readOnly: true
        broj_unosa:
          type: string
          readOnly: true
      required:
      - broj_unosa
      - datum_Do
      - datum_Od
      - datum_dodele
      - id
      - korisnik
      - korisnik_ime
      - kpi
      - kpi_naziv
      - kpi_opis
      - kpi_target
      - poslednja_vrednost
      - procenat
    DodeljeniKPIDetalj:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kpi:
          type: integer
        kpi_naziv:
          type: string
          readOnly: true
        kpi_opis:
          type: string
          readOnly: true
        kpi_target:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        korisnik:
          type: integer
        korisnik_ime:
          type: string
          readOnly: true
        datum_Od:
          type: string
          format: date
        datum_Do:
          type: string
          format: date
        datum_dodele:
          type: string
          format: date
          readOnly: true
        poslednja_vrednost:
          type: string
          readOnly: true
        procenat:
          type: string
          readOnly: true
        broj_unosa:
          type: string
          readOnly: true
        istorija:
          type: array
          items:
            $ref: '#/components/schemas/OstvareniKPI'
          readOnly: true
